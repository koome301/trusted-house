<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Trusted House - Welcome</title>
  <style>
    body { font-family: Arial; margin: 0; padding: 20px; background: #f0f0f0; }
    .container { max-width: 500px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; }
    button { background: #007bff; color: white; border: none; cursor: pointer; }
    .hidden { display: none; }
    .menu { background: #333; color: white; padding: 10px; text-align: center; }
    .menu a { color: white; text-decoration: none; margin: 0 10px; }
  </style>
</head>
<body>
  <div class="menu">
    <strong>Trusted House</strong> - <span id="userGreeting"></span>
    <a href="#" onclick="showSection('loginSection')">Login</a>
    <a href="#" onclick="showSection('signupSection')">Sign Up</a>
    <a href="#" onclick="showSection('profileSection')">Profile</a>
    <a href="#" onclick="showSection('productsSection')">Products</a>
    <a href="#" onclick="showSection('adminLoginSection')">Admin</a>
  </div>

  <div class="container" id="loginSection">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <label><input type="checkbox" onclick="togglePassword('password')"> Show Password</label>
    <button onclick="login()">Login</button>
    <p><a href="#" onclick="showForgotPassword()">Forgot Password?</a></p>
    <p><a href="#" onclick="showChangePassword()">Change Password</a></p>
  </div>

  <div class="container hidden" id="signupSection">
    <h2>Sign Up</h2>
    <input type="text" id="firstName" placeholder="First Name">
    <input type="text" id="lastName" placeholder="Last Name">
    <input type="email" id="signupEmail" placeholder="Email">
    <input type="password" id="signupPassword" placeholder="Password">
    <label><input type="checkbox" onclick="togglePassword('signupPassword')"> Show Password</label>
    <button onclick="signUp()">Create Account</button>
  </div>

  <div class="container hidden" id="profileSection">
    <h2>Your Profile</h2>
    <p id="profileDetails"></p>
  </div>

  <div class="container hidden" id="productsSection">
    <h2>Available Products</h2>
    <div id="productList">(Products will load here...)</div>
    <button onclick="alert('Buy Now with M-Pesa - Manual Instructions Sent')">Buy Now with M-Pesa</button>
  </div>

  <div class="container hidden" id="adminLoginSection">
    <h2>Admin Login</h2>
    <input type="text" id="adminUser" placeholder="Username">
    <input type="password" id="adminPass" placeholder="Password">
    <button onclick="adminLogin()">Login as Admin</button>
  </div>

  <div class="container hidden" id="adminPanel">
    <h2>Admin Panel</h2>
    <p>Welcome, Admin!</p>
    <input type="text" id="productName" placeholder="Product Name">
    <button onclick="uploadProduct()">Upload Product</button>
    <ul id="adminProductList"></ul>
  </div>

  <div class="container hidden" id="otpSection">
    <h3>Enter OTP</h3>
    <input type="text" id="otp" placeholder="Enter OTP">
    <button onclick="verifyOTP()">Verify</button>
  </div>

  <div class="container hidden" id="forgotSection">
    <h3>Forgot Password</h3>
    <input type="email" id="forgotEmail" placeholder="Enter your email">
    <button onclick="sendOTP('forgot')">Send OTP</button>
  </div>

  <div class="container hidden" id="changeSection">
    <h3>Change Password</h3>
    <input type="email" id="changeEmail" placeholder="Enter your email">
    <button onclick="sendOTP('change')">Send OTP</button>
  </div>

  <div class="container hidden" id="newPasswordSection">
    <h3>Set New Password</h3>
    <input type="password" id="newPassword" placeholder="New Password">
    <label><input type="checkbox" onclick="togglePassword('newPassword')"> Show Password</label>
    <button onclick="saveNewPassword()">Save Password</button>
  </div>

  <script>
    let currentUser = null;
    let currentOTP = null;
    let resetMode = '';

    function togglePassword(fieldId) {
      const field = document.getElementById(fieldId);
      field.type = field.type === 'password' ? 'text' : 'password';
    }

    function signUp() {
      const user = {
        firstName: document.getElementById('firstName').value,
        lastName: document.getElementById('lastName').value,
        email: document.getElementById('signupEmail').value,
        password: document.getElementById('signupPassword').value
      };
      if (!user.email || !user.password || !user.firstName || !user.lastName) {
        alert('Please fill all fields.');
        return;
      }
      localStorage.setItem('user', JSON.stringify(user));
      alert('Account created! Now login.');
      showSection('loginSection');
    }

    function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const user = JSON.parse(localStorage.getItem('user'));
      if (user && user.email === email && user.password === password) {
        alert('Login successful!');
        document.getElementById('userGreeting').textContent = user.firstName;
        showSection('profileSection');
        document.getElementById('profileDetails').innerHTML =
          `<strong>Name:</strong> ${user.firstName} ${user.lastName}<br><strong>Email:</strong> ${user.email}`;
      } else {
        alert('Incorrect credentials');
      }
    }

    function showSection(sectionId) {
      const sections = document.querySelectorAll('.container');
      sections.forEach(sec => sec.classList.add('hidden'));
      document.getElementById(sectionId).classList.remove('hidden');
    }

    function showForgotPassword() {
      showSection('forgotSection');
      resetMode = 'forgot';
    }

    function showChangePassword() {
      showSection('changeSection');
      resetMode = 'change';
    }

    function sendOTP(mode) {
      const email = document.getElementById(mode === 'forgot' ? 'forgotEmail' : 'changeEmail').value;
      const user = JSON.parse(localStorage.getItem('user'));
      if (user && user.email === email) {
        currentUser = user;
        currentOTP = Math.floor(100000 + Math.random() * 900000).toString();
        alert('Simulated OTP (for testing): ' + currentOTP);
        showSection('otpSection');
      } else {
        alert('Email not found');
      }
    }

    function verifyOTP() {
      const enteredOTP = document.getElementById('otp').value;
      if (enteredOTP === currentOTP) {
        alert('OTP verified. You can now change your password.');
        showSection('newPasswordSection');
      } else {
        alert('Invalid OTP');
      }
    }

    function saveNewPassword() {
      const newPassword = document.getElementById('newPassword').value;
      if (!newPassword) {
        alert('Enter a new password.');
        return;
      }
      currentUser.password = newPassword;
      localStorage.setItem('user', JSON.stringify(currentUser));
      alert('Password updated!');
      showSection('loginSection');
    }

    function adminLogin() {
      const user = document.getElementById('adminUser').value;
      const pass = document.getElementById('adminPass').value;
      if (user === 'admin' && pass === 'admin123') {
        alert('Welcome Admin');
        showSection('adminPanel');
        loadAdminProducts();
      } else {
        alert('Invalid admin credentials');
      }
    }

    function uploadProduct() {
      const name = document.getElementById('productName').value;
      if (!name) return alert('Enter product name');
      let products = JSON.parse(localStorage.getItem('products') || '[]');
      products.push(name);
      localStorage.setItem('products', JSON.stringify(products));
      alert('Product uploaded');
      document.getElementById('productName').value = '';
      loadAdminProducts();
    }

    function loadAdminProducts() {
      const list = document.getElementById('adminProductList');
      list.innerHTML = '';
      const products = JSON.parse(localStorage.getItem('products') || '[]');
      products.forEach(p => {
        const li = document.createElement('li');
        li.textContent = p;
        list.appendChild(li);
      });
    }

    function loadUserProducts() {
      const list = document.getElementById('productList');
      const products = JSON.parse(localStorage.getItem('products') || '[]');
      list.innerHTML = products.map(p => `<li>${p}</li>`).join('');
    }

    window.onload = loadUserProducts;
  </script>
</body>
</html>
